name: CI/CD Pipeline

on:
  push:
    branches:
    - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: go-app-cluster
  GKE_ZONE: us-central1-a

jobs:
  deploy:
    runs-on: alpine/k8s:1.29.13

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup GCP Auth
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Configure Docker
      run: gcloud auth configure-docker

    - name: Build and Push Docker Image
      run: |
        docker build -t gcr.io/$PROJECT_ID/go-app:$GITHUB_SHA ./go-app
        docker push gcr.io/$PROJECT_ID/go-app:$GITHUB_SHA

    - name: Get GKE Credentials
      run: |
        gcloud container clusters get-credentials $GKE_CLUSTER \
          --zone $GKE_ZONE \
          --project $PROJECT_ID

    - name: Deploy to GKE
      run: |
        # Update the image in the deployment manifest
        sed -i "s|gcr.io/<PROJECT_ID>/go-app:latest|gcr.io/$PROJECT_ID/go-app:$GITHUB_SHA|g" ./k8s/deployment.yaml

        # Apply Kubernetes manifests
        kubectl apply -f ./k8s/namespace.yaml
        kubectl apply -f ./k8s/deployment.yaml
        kubectl apply -f ./k8s/service.yaml

        # Check rollout status
        kubectl rollout status deployment/go-app --namespace go-app
